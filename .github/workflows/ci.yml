name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sca
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: supply_chain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sca -d supply_chain"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: sca
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: supply_chain
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + SQL tests (against synthetic sample data)
        run: pytest -q
      - name: Run the full Prefect flow on the sample data
        run: python flows/pipeline.py data/sample
      - name: DQ summary
        run: python -m sca.dq
